name: Auto Check Links

on:
  schedule:
    - cron: '0 3 * * *'
  push:
    branches:
      - main

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build README
        run: node scripts/build-readme.js

      - name: Commit changes if README updated
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "nnhann99@gmail.com"
          git add README.md
          git diff --cached --quiet && echo "No changes" || (git commit -m "Auto-update: Check links and regenerate README" && git push)
