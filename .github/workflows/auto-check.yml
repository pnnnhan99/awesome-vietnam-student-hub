name: Auto Check Links

on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build README
        run: node scripts/build-readme.js

      - name: Auto-commit updates
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "nnhann99@gmail.com"
          git add README.md
          git diff --staged --quiet || (git commit -m "chore: auto update links status & readme" && git push)
